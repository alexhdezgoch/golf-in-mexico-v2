<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page not found | Golf in Mexico°</title>
    <link rel="icon" href="/logo-wordmark.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;1,400&family=Outfit:wght@300;400&family=Space+Mono&display=swap" rel="stylesheet" />
    <!-- Static on purpose: Vercel serves this file with a real HTTP 404 for any
         path that has no prerendered page, so it must not depend on the app bundle. -->
    <style>
      body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f8f6f1;color:#1c1c1a;font-family:Outfit,system-ui,sans-serif;font-weight:300;text-align:center}
      main{padding:48px 24px;max-width:640px}
      .eyebrow{font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#b8975a;margin:0}
      h1{font-family:"Libre Baskerville",Georgia,serif;font-weight:400;font-size:clamp(32px,6vw,56px);line-height:1.05;letter-spacing:-.02em;margin:20px 0 24px}
      h1 em{color:#b8975a}
      p{font-size:18px;line-height:1.7;margin:0 0 36px;color:#55554f}
      a{color:inherit}
      .cta{display:inline-block;border:1px solid #b8975a;padding:16px 32px;font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;text-decoration:none}
      .cta:hover,.cta:focus-visible{background:#b8975a;color:#0f2419}
      nav{margin-top:40px;display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:center;font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase}
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Error 404</p>
      <h1>This page is <em>out of bounds.</em></h1>
      <p>The page you are looking for does not exist or has moved.</p>
      <a class="cta" href="/">Back to the homepage</a>
      <nav aria-label="Site sections">
        <a href="/destinations">Destinations</a>
        <a href="/golf-packages">Golf packages</a>
        <a href="/journal">Journal</a>
        <a href="/contact">Contact</a>
      </nav>
    </main>
  </body>
</html>
