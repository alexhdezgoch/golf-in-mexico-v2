<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#0f2419" />
        <!-- The G° mark: tab icon, phone home screen, Android. -->
        <link rel="icon" href="/favicon.ico" sizes="48x48" />
        <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
        <link rel="manifest" href="/site.webmanifest" />
        <meta name="description" content="We help golfers play Mexico&#39;s best: curated trips around the top courses, authentic local experiences and the best value for every group." />
        <!-- The home page's card when shared; every other page sets its own (hooks/useSeo.js). -->
        <meta property="og:site_name" content="GOLF° IN MEXICO°" />
        <meta property="og:type" content="website" />
        <meta property="og:title" content="Curated Golf Trips to Mexico&#39;s Top Courses | GOLF° IN MEXICO°" />
        <meta property="og:description" content="We help golfers play Mexico&#39;s best: curated trips around the top courses, authentic local experiences and the best value for every group." />
        <meta property="og:image" content="https://golf-in-mexico.com/og/home.jpg" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta property="og:url" content="https://golf-in-mexico.com/" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="Curated Golf Trips to Mexico&#39;s Top Courses | GOLF° IN MEXICO°" />
        <meta name="twitter:description" content="We help golfers play Mexico&#39;s best: curated trips around the top courses, authentic local experiences and the best value for every group." />
        <meta name="twitter:image" content="https://golf-in-mexico.com/og/home.jpg" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Outfit:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
        <title>Curated Golf Trips to Mexico's Top Courses | GOLF° IN MEXICO°</title>
        <script>window.addEventListener("error",function(e){if(e.error instanceof DOMException&&e.error.name==="DataCloneError"&&e.message&&e.message.includes("PerformanceServerTiming")){e.stopImmediatePropagation();e.preventDefault()}},true);</script>
        <!-- First-paint intro curtain: covers the prerendered content for first-time
             visitors until the JS Intro splash mounts, so there's no flash of the page
             before the splash. Crawlers / no-JS never run this, so they get clean
             content; returning visitors (session flag set) and prerender skip it. -->
        <style>html[data-gim-intro="pending"]::before{content:"";position:fixed;inset:0;z-index:9998;background:#f8f6f1}</style>
        <!-- The intro plays once a visit, and only on the home page: a visitor who lands on a guide, a course or the trip builder from search or an ad goes straight to it. -->
        <script>(function(){try{if(location.pathname!=="/")return;if(sessionStorage.getItem("gim-intro-seen")==="1")return;if(/[?&]skipIntro=1/.test(location.search))return;var d=document.documentElement;d.setAttribute("data-gim-intro","pending");setTimeout(function(){d.removeAttribute("data-gim-intro")},6000)}catch(e){}})();</script>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
    </body>
</html>
